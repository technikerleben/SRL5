name: AIU Tests

on:
  push:
    paths:
      - "aiu/**"
  pull_request:
    paths:
      - "aiu/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiu/tests
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiu/tests/package.json

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Smoke-Test ausführen
        run: npm run smoke

  baseline-check:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.baselines.outputs.present }}
    defaults:
      run:
        working-directory: aiu/tests
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Referenzbilder suchen
        id: baselines
        shell: bash
        run: |
          if find . -type f -path "*-snapshots/*.png" -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Keine Referenzbilder vorhanden; visueller Test wird übersprungen."
          fi

  visual:
    needs: baseline-check
    if: needs.baseline-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiu/tests
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiu/tests/package.json

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Visuelle Tests ausführen
        run: npm run visual -- --reporter=html

      - name: Playwright-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiu-playwright-report
          path: aiu/tests/playwright-report/
          if-no-files-found: warn
          retention-days: 14
