<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Ohne Schrägstrich am Ende (…/expedition) würden alle relativen Pfade ins Leere zeigen.
  if (/\/expedition$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<title>Expedition Otterbucht – Planung · Durchführung · Reflexion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦦</text></svg>">
<link rel="stylesheet" href="style.css">
<script src="vendor/gsap.min.js"></script>
<script src="vendor/confetti.browser.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>

<!-- START -->
<section id="scr-start" class="screen">
  <div class="start-wrap">
    <div class="start-hero">
      <div class="hero-animals" aria-hidden="true"><span class="bob">🦦</span><span class="bob d2">🦡</span></div>
      <h1>Expedition Otterbucht</h1>
      <p class="hero-sub">Ein Strategiespiel für zwei – mit <b>Planung</b>, <b>Durchführung</b> und <b>Reflexion</b></p>
    </div>
    <div class="start-cols">
      <div class="card">
        <h2>Neues Team</h2>
        <label for="team-name">Euer Teamname</label>
        <input id="team-name" maxlength="28" placeholder="z. B. Die Muschelsucher" autocomplete="off">
        <div class="chips" id="name-ideas"></div>
        <button class="btn btn-primary btn-big" id="btn-new-team">Expedition starten →</button>
      </div>
      <div class="card">
        <h2>Weiterspielen</h2>
        <div id="team-list" class="team-list"></div>
      </div>
    </div>
    <button class="btn btn-ghost small" id="btn-teacher">👩‍🏫 Übersicht für die Lehrkraft</button>
  </div>
</section>

<!-- INTRO -->
<section id="scr-intro" class="screen" hidden>
  <div class="intro-wrap">
    <div class="intro-dots" id="intro-dots"></div>
    <div class="intro-slide card" id="intro-slide"></div>
    <div class="intro-nav">
      <button class="btn btn-secondary" id="intro-back">← Zurück</button>
      <button class="btn btn-primary" id="intro-next">Weiter →</button>
    </div>
  </div>
</section>

<!-- KARTE -->
<section id="scr-map" class="screen" hidden>
  <header class="topbar">
    <div class="brand">🦦 Expedition Otterbucht <span class="team-pill" id="map-team"></span></div>
    <div class="top-actions">
      <button class="btn btn-top" data-act="tutorial">🎓 Tutorial</button>
      <button class="btn btn-top" data-act="recap">👋 Wo stehen wir?</button>
      <button class="btn btn-top" data-act="strategies">🧭 Strategien</button>
      <button class="btn btn-top" data-act="logbook">📖 Logbuch</button>
      <button class="btn btn-top" data-act="rules">❓ Regeln</button>
      <button class="btn btn-top" data-act="home">🏠</button>
    </div>
  </header>
  <div class="map-wrap">
    <div class="map-head">
      <h2>Eure Expeditionskarte</h2>
      <div class="star-total" id="star-total"></div>
    </div>
    <div class="worlds" id="worlds"></div>
  </div>
</section>

<!-- SPIEL -->
<section id="scr-game" class="screen" hidden>
  <header class="topbar">
    <div class="brand"><button class="btn btn-top" data-act="map" title="Zur Karte">🗺️ Karte</button>
      <span class="lvl-title" id="lvl-title"></span></div>
    <nav class="phases" aria-label="Phasen">
      <div class="phase" data-ph="planung"><span class="ph-num">1</span> Planung</div>
      <div class="ph-arrow">›</div>
      <div class="phase" data-ph="durchfuehrung"><span class="ph-num">2</span> Durchführung</div>
      <div class="ph-arrow">›</div>
      <div class="phase" data-ph="reflexion"><span class="ph-num">3</span> Reflexion</div>
    </nav>
    <div class="top-actions">
      <button class="btn btn-top hl" data-act="recap">👋 Wo stehen wir?</button>
      <button class="btn btn-top" data-act="strategies" title="Strategien">🧭</button>
      <button class="btn btn-top" data-act="logbook" title="Logbuch">📖</button>
      <button class="btn btn-top" data-act="rules" title="Regeln">❓</button>
      <button class="btn btn-top" data-act="sound" id="btn-sound" title="Ton an/aus">🔇</button>
    </div>
  </header>
  <div class="game-body">
    <div class="board-wrap">
      <div id="board"></div>
      <div class="board-hud">
        <div class="hud-chip" id="hud-shells">🐚 0/0</div>
        <div class="hud-chip" id="hud-step">Schritt –</div>
      </div>
      <div class="board-tools">
        <button class="btn btn-tool" id="btn-preview" aria-pressed="false">👣 Spur zeigen</button>
        <button class="btn btn-tool" id="btn-view">🎥 Ansicht zurück</button>
      </div>
      <div class="board-legend" id="board-legend"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
</section>

<!-- ETAPPEN-REFLEXION -->
<section id="scr-world" class="screen" hidden>
  <div class="world-wrap card" id="world-wrap"></div>
</section>

<!-- URKUNDE -->
<section id="scr-end" class="screen" hidden>
  <div class="end-wrap" id="end-wrap"></div>
</section>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="btn btn-close" id="modal-close" aria-label="Schließen">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="print-area"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script>
  // Hinweis, falls das Spiel nicht startet (z. B. sehr alter Browser)
  setTimeout(function () {
    if (window.__exp) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:99;background:#FDECEA;color:#7A1B14;border-left:5px solid #C0392B;padding:12px 16px;border-radius:8px;font:16px Arial,sans-serif';
    d.innerHTML = '<b>Das Spiel konnte nicht starten.</b> Bitte die Seite neu laden (Strg + F5). Falls das nicht hilft: einen aktuellen Chrome, Edge oder Firefox verwenden.';
    document.body.appendChild(d);
  }, 5000);
</script>
</body>
</html>
