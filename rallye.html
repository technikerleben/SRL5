<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schulrallye 2026 – Auflösung · Klasse 5.3</title>
<style>
:root{
  --blau-50:#EFF5FA; --blau-100:#DDEAF4; --blau-200:#BDD4E7; --blau-300:#91B6D4;
  --blau-400:#5F91B7; --blau-500:#356D9C; --blau-600:#245688; --blau-700:#1F4770;
  --blau-800:#1C3D5E; --blau-900:#19334E; --blau-950:#0F2134;
  --minz-50:#EFFCFA; --minz-100:#D6F8F3; --minz-200:#ADEFE7; --minz-300:#7AE7DA;
  --minz-400:#48DCCB; --minz-500:#24B9AA; --minz-600:#1B958A; --minz-700:#19766F;
  --or-50:#FFF8F2; --or-100:#FEEEDD; --or-200:#FBD8B9; --or-300:#F6C18F;
  --or-400:#F0A66F; --or-500:#E8833B; --or-600:#CF6320; --or-700:#A94A1A;
  --weiss:#FFFFFF; --hellgrau:#F2F4F6; --linie:#DFE5EA; --linie-kraeftig:#C5D0D9;
  --text:#18324A; --text-sek:#3D5061;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter','Aptos','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:linear-gradient(135deg,#1C3D5E 0%,#245688 52%,#356D9C 100%);
  background-attachment:fixed;
  color:var(--text);
  display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;overflow:hidden;
}
:focus-visible{outline:3px solid var(--or-500);outline-offset:3px;border-radius:6px}

/* ---------- Kopfzeile ---------- */
header{
  display:flex;align-items:center;gap:16px;padding:10px 24px;
  background:rgba(15,33,52,.55);border-bottom:2px solid rgba(255,255,255,.18);
  color:#fff;flex-wrap:wrap;
}
.marke{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.marke .otter{font-size:1.4rem;line-height:1}
.marke .sub{font-weight:500;opacity:.85;font-size:.85rem;display:block}
.kopf-rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.zaehler{
  background:var(--blau-950);border:2px solid var(--minz-400);color:#fff;
  font-weight:800;font-size:1rem;padding:7px 14px;border-radius:10px;font-variant-numeric:tabular-nums;
}
.icon-btn{
  min-width:44px;min-height:44px;padding:8px 14px;background:transparent;
  border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;
  font-size:.95rem;font-weight:600;cursor:pointer;
}
.icon-btn:hover{background:rgba(255,255,255,.14)}

#fortschritt{height:8px;background:rgba(255,255,255,.2);flex:0 0 auto}
#fortschritt-balken{height:100%;width:0;background:var(--minz-400);transition:width .25s ease}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.folie{width:100%;max-width:1080px}

/* ---------- Karte allgemein ---------- */
.karte{
  background:var(--weiss);border-radius:32px;padding:40px 48px;
  box-shadow:0 18px 50px rgba(15,33,52,.35);
}

/* ---------- Wendekarte ---------- */
.flip{perspective:2200px;animation:auf .3s ease}
@keyframes auf{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.flip-inner{
  display:grid;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,.05,.2,1);
}
.flip.ist-gedreht .flip-inner{transform:rotateY(180deg)}

.seite{
  grid-area:1/1;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:32px;padding:44px 48px;
  box-shadow:0 18px 50px rgba(15,33,52,.35);
  display:flex;flex-direction:column;justify-content:center;
  min-height:44vh;
}
.vorderseite{background:var(--weiss);border:3px solid var(--blau-200)}
.rueckseite{
  transform:rotateY(180deg);
  background:var(--minz-50);border:3px solid var(--minz-600);
}

/* Vorderseite */
.nummer{
  align-self:flex-start;display:inline-flex;align-items:center;gap:10px;
  background:var(--or-400);color:var(--text);border:2px solid var(--or-700);
  border-radius:999px;padding:6px 20px;font-weight:800;font-size:1.05rem;
  letter-spacing:.4px;margin-bottom:24px;
}
.frage{font-size:clamp(1.5rem,3.3vw,2.6rem);font-weight:700;line-height:1.3}
.tipp{
  margin-top:18px;background:var(--blau-50);border-left:6px solid var(--blau-600);
  border-radius:0 12px 12px 0;padding:12px 18px;font-size:1.05rem;color:var(--text-sek);
}
.dreh-hinweis{
  margin-top:auto;padding-top:26px;color:var(--text-sek);
  font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:8px;
}

/* Rückseite */
.nummer-loesung{
  align-self:flex-start;display:inline-flex;align-items:center;gap:10px;
  background:var(--minz-600);color:#fff;border-radius:999px;padding:6px 20px;
  font-weight:800;font-size:1.05rem;letter-spacing:.4px;margin-bottom:20px;
}
.frage-klein{font-size:1.05rem;font-weight:600;color:var(--text-sek);margin-bottom:18px;line-height:1.45}
.loesung-text{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;line-height:1.25;color:var(--text)}

/* ---------- Start / Ende ---------- */
.zentriert{text-align:center;animation:auf .3s ease}
.zentriert h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.15;color:var(--blau-700)}
.kicker{
  display:inline-block;background:var(--minz-100);border:2px solid var(--minz-600);
  color:var(--text);border-radius:999px;padding:6px 20px;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;font-size:.9rem;margin-bottom:20px;
}
.lead{font-size:clamp(1.05rem,2vw,1.4rem);color:var(--text-sek);margin-top:18px;line-height:1.6}
.hinweis-liste{margin:28px auto 0;max-width:640px;text-align:left;background:var(--blau-50);border-radius:20px;padding:20px 24px}
.hinweis-liste li{margin-left:20px;font-size:1.05rem;color:var(--text-sek);padding:4px 0}

/* ---------- Steuerleiste ---------- */
footer{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 24px 20px;flex-wrap:wrap}
.btn{
  min-height:52px;min-width:52px;padding:12px 26px;border-radius:14px;
  font-size:1.05rem;font-weight:700;cursor:pointer;border:2px solid transparent;font-family:inherit;
}
.btn-haupt{background:var(--blau-600);color:#fff;border-color:var(--blau-950)}
.btn-haupt:hover{background:var(--blau-700)}
.btn-neben{background:var(--weiss);color:var(--blau-700);border-color:var(--blau-600)}
.btn-neben:hover{background:var(--blau-50)}
.btn-impuls{background:var(--or-400);color:var(--text);border-color:var(--or-700);font-size:1.2rem;padding:14px 32px}
.btn-impuls:hover{background:var(--or-300)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.tastenhinweis{width:100%;text-align:center;color:rgba(255,255,255,.8);font-size:.85rem;margin-top:2px}

/* ---------- Übersicht ---------- */
#uebersicht[hidden]{display:none}
#uebersicht{position:fixed;inset:0;background:rgba(15,33,52,.88);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.ueb-box{background:var(--weiss);border-radius:28px;padding:28px;max-width:820px;width:100%;max-height:88vh;overflow-y:auto}
.ueb-box h2{color:var(--blau-700);font-size:1.5rem;margin-bottom:6px}
.ueb-info{color:var(--text-sek);font-size:.95rem;margin-bottom:18px}
.ueb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.ueb-grid button{
  min-height:56px;border-radius:12px;border:2px solid var(--blau-200);background:var(--blau-50);
  color:var(--blau-700);font-weight:800;font-size:1.1rem;cursor:pointer;
}
.ueb-grid button.aktiv{background:var(--blau-600);color:#fff;border-color:var(--blau-950)}

@media (prefers-reduced-motion: reduce){
  .flip-inner{transition:none}
  .flip,.zentriert{animation:none}
}
@media (max-width:640px){
  .seite{padding:26px 22px;border-radius:24px;min-height:auto}
  .karte{padding:26px 22px;border-radius:24px}
  header{padding:8px 14px}
  .marke .sub{display:none}
  main{padding:14px}
  .btn{padding:12px 18px;font-size:1rem}
}
</style>
</head>
<body>

<header>
  <div class="marke">
    <span class="otter" aria-hidden="true">🦦</span>
    <span>Klasse 5.3<span class="sub">Schulrallye 2026 – Auflösung</span></span>
  </div>
  <div class="kopf-rechts">
    <span class="zaehler" id="zaehler">Start</span>
    <button class="icon-btn" id="btn-uebersicht" aria-haspopup="dialog">☰ Übersicht</button>
    <button class="icon-btn" id="btn-vollbild">⛶ Vollbild</button>
  </div>
</header>

<div id="fortschritt" role="presentation"><div id="fortschritt-balken"></div></div>

<main>
  <div class="folie" id="folie" aria-live="polite"></div>
</main>

<footer>
  <button class="btn btn-neben" id="btn-zurueck">← Zurück</button>
  <button class="btn btn-impuls" id="btn-loesung">🔄 Karte umdrehen</button>
  <button class="btn btn-haupt" id="btn-weiter">Weiter →</button>
  <p class="tastenhinweis">Leertaste / → = weiter · ← = zurück · L = Karte umdrehen · U = Übersicht</p>
</footer>

<div id="uebersicht" hidden role="dialog" aria-modal="true" aria-label="Fragenübersicht">
  <div class="ueb-box">
    <h2>Alle Fragen im Überblick</h2>
    <p class="ueb-info">Tippe auf eine Nummer, um direkt zu dieser Frage zu springen.</p>
    <div class="ueb-grid" id="ueb-grid"></div>
    <div style="margin-top:20px">
      <button class="btn btn-neben" id="btn-ueb-schliessen">Schließen</button>
    </div>
  </div>
</div>

<script>
const FRAGEN = [
  {f:"Welche Tiere sind im rechten Schaukasten des Terrariums neben dem Schulzoo zu finden?", a:"Schmetterlinge"},
  {f:"Welcher NW-Raum befindet sich gegenüber vom Schulzoo?", a:"NW A3"},
  {f:"Welchen Beruf hat Herr Friedrich, der in Raum B 110 sein Büro hat?", a:"Schulsozialarbeiter"},
  {f:"Wie viele Bilder hängen neben dem Kunstraum KU B1.1 im B-Gebäude?", a:"4"},
  {f:"Wann ist das Sekretariat B (B112) für Schülerinnen &amp; Schüler geöffnet?", a:"In den Pausen"},
  {f:"Welches Fach wird im Keller des A-Gebäudes unterrichtet?", a:"Technik"},
  {f:"Im PZ steht ein Musikinstrument. Wie nennt man dieses Instrument?", a:"Klavier"},
  {f:"In Raum B111 sitzt Herr Schnitker. Was ist seine Aufgabe an dieser Schule?", a:"Schulleiter"},
  {f:"Wie heißt die Schul-Sekretärin im B-Gebäude?", a:"Frau Bartsch"},
  {f:"Wann ist die Stadtteilbücherei am Donnerstag geöffnet?", a:"13 – 17 Uhr"},
  {f:"Wie viele Eingangstüren hat unsere Turnhalle?", a:"4"},
  {f:"Wie viele Treppenstufen musst du hochsteigen, wenn du vom B-Schulhof zum Eingang des B-Gebäudes gehen möchtest?", a:"11"},
  {f:"An welchem Gebäudeeingang findet ihr die Schülervertretung (SV)?", a:"Eingang A", t:"Sucht in der Nähe der Hausmeister!"},
  {f:"Welche Raumnummer hat das Zimmer der Sozialarbeiterin Frau Küster?", a:"B118"},
  {f:"Wo befindet sich das Lehrerzimmer A?", a:"Schräg gegenüber vom IF A und in der Nähe des Atriums"},
  {f:"Was kostet eine Flasche Mineralwasser in der Cafeteria?", a:"1,50 €"},
  {f:"Gegenüber vom Sekretariat im B-Gebäude hängen vier grüne Bilderrahmen mit vielen Lehrerfotos. Wie heißt die Lehrerin, die im 2. Rahmen ganz unten in der linken Ecke abgebildet ist?", a:"Frau Hedemann"},
  {f:"Wo befindet sich der Schulgarten?", a:"Hinter Gebäude B"},
  {f:"Im Atrium gibt es eine Tafel mit einer Leuchtanzeige. Was wird auf dieser Tafel angezeigt?", a:"Stromerzeugung, Photovoltaik"},
  {f:"Wo findet man den Sanitäter-Raum (A-Gebäude)?", a:"B119"},
  {f:"Wo ist das Unterstützungszentrum (UZ)?", a:"Durchgang zwischen A- und B-Schulhof", t:"Suche in der Nähe der Sporthalle."},
  {f:"Welche Raumnummer hat das Zimmer der Sozialarbeiterin Frau Onat-Seykan (A-Gebäude)?", a:"A271"}
];

const MAX = FRAGEN.length;
let index = 0;        // 0 = Start · 1..MAX = Fragen · MAX+1 = Ende
let gedreht = false;

const el = id => document.getElementById(id);
const folie = el('folie');

/* ---------- Rendern ---------- */
function render(){
  if(index === 0)      folie.innerHTML = startFolie();
  else if(index > MAX) folie.innerHTML = endFolie();
  else                 folie.innerHTML = frageFolie(index);

  const karte = folie.querySelector('.flip');
  if(karte) karte.addEventListener('click', drehen);

  el('zaehler').textContent = index === 0 ? 'Start' : (index > MAX ? 'Ende' : 'Frage ' + index + ' / ' + MAX);
  el('fortschritt-balken').style.width = (Math.min(index, MAX) / MAX * 100) + '%';
  el('btn-zurueck').disabled = index === 0;
  el('btn-weiter').disabled  = index > MAX;
  aktualisiereDrehknopf();
}

function aktualisiereDrehknopf(){
  const b = el('btn-loesung');
  const istFrage = index >= 1 && index <= MAX;
  b.style.display = istFrage ? '' : 'none';
  b.textContent = gedreht ? '🔄 Zurück zur Frage' : '🔄 Karte umdrehen';
}

function frageFolie(n){
  const q = FRAGEN[n-1];
  const tipp = q.t ? `<p class="tipp"><strong>Tipp:</strong> ${q.t}</p>` : '';
  return `<div class="flip" role="button" tabindex="0" aria-label="Karte umdrehen">
    <div class="flip-inner">
      <div class="seite vorderseite">
        <span class="nummer">Frage ${n} von ${MAX}</span>
        <p class="frage">${q.f}</p>
        ${tipp}
        <p class="dreh-hinweis"><span aria-hidden="true">🔄</span> Karte antippen, um die Lösung zu sehen</p>
      </div>
      <div class="seite rueckseite">
        <span class="nummer-loesung"><span aria-hidden="true">✓</span> Lösung ${n}</span>
        <p class="frage-klein">${q.f}</p>
        <p class="loesung-text">${q.a}</p>
      </div>
    </div>
  </div>`;
}

function startFolie(){
  return `<div class="karte zentriert">
    <span class="kicker">Schulrallye 2026</span>
    <h1>Wir lösen die Rallye gemeinsam auf!</h1>
    <p class="lead">Wir gehen alle <strong>${MAX} Fragen</strong> nacheinander durch.
    Erst lesen wir die Frage vor und ihr sagt eure Antwort – dann drehen wir die Karte um.</p>
    <div class="hinweis-liste">
      <ul>
        <li>Karte antippen oder <strong>🔄 Karte umdrehen</strong> zeigt die Lösung.</li>
        <li><strong>Weiter →</strong> springt zur nächsten Frage.</li>
        <li><strong>☰ Übersicht</strong> führt direkt zu jeder Frage.</li>
      </ul>
    </div>
  </div>`;
}

function endFolie(){
  return `<div class="karte zentriert">
    <span class="kicker">Geschafft</span>
    <h1>Toll gemacht, Otterklasse!</h1>
    <p class="lead">Alle ${MAX} Fragen sind aufgelöst.
    Ihr kennt euch jetzt schon richtig gut an unserer Schule aus.</p>
  </div>`;
}

/* ---------- Drehen & Navigation ---------- */
function drehen(){
  if(index < 1 || index > MAX) return;
  gedreht = !gedreht;
  folie.querySelector('.flip').classList.toggle('ist-gedreht', gedreht);
  aktualisiereDrehknopf();
}
function weiter(){
  if(index >= 1 && index <= MAX && !gedreht){ drehen(); return; }
  if(index > MAX) return;
  index++; gedreht = false; render();
}
function zurueck(){
  if(index === 0) return;
  index--; gedreht = false; render();
}
function springe(n){ index = n; gedreht = false; render(); schliesseUebersicht(); }

el('btn-weiter').addEventListener('click', weiter);
el('btn-zurueck').addEventListener('click', zurueck);
el('btn-loesung').addEventListener('click', drehen);

/* ---------- Übersicht ---------- */
function oeffneUebersicht(){
  const grid = el('ueb-grid');
  grid.innerHTML = FRAGEN.map((q,i) =>
    `<button class="${i+1===index?'aktiv':''}" data-n="${i+1}">${i+1}</button>`).join('');
  grid.querySelectorAll('button').forEach(b => b.addEventListener('click', () => springe(+b.dataset.n)));
  el('uebersicht').hidden = false;
}
function schliesseUebersicht(){ el('uebersicht').hidden = true; }
el('btn-uebersicht').addEventListener('click', oeffneUebersicht);
el('btn-ueb-schliessen').addEventListener('click', schliesseUebersicht);
el('uebersicht').addEventListener('click', e => { if(e.target.id === 'uebersicht') schliesseUebersicht(); });

/* ---------- Vollbild ---------- */
el('btn-vollbild').addEventListener('click', () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

/* ---------- Tastatur ---------- */
document.addEventListener('keydown', e => {
  if(!el('uebersicht').hidden){ if(e.key === 'Escape') schliesseUebersicht(); return; }
  const aufKarte = e.target.classList && e.target.classList.contains('flip');
  if(e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if(aufKarte && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); drehen(); return; }
  switch(e.key){
    case ' ': case 'ArrowRight': case 'PageDown': e.preventDefault(); weiter(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); zurueck(); break;
    case 'l': case 'L': e.preventDefault(); drehen(); break;
    case 'u': case 'U': case 'ü': case 'Ü': e.preventDefault(); oeffneUebersicht(); break;
    case 'Home': e.preventDefault(); springe(0); break;
  }
});

render();
</script>
</body>
</html>
